<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — AD Rio Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;justify-content:center;}
  .wrap{max-width:460px;width:100%;min-height:100vh;background:#fff;}
  .hero{
    background:linear-gradient(160deg, var(--blue-600), var(--blue-400));
    padding:38px 26px 30px;color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .hero img{width:64px;height:64px;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .hero h1{font-size:22px;margin:0 0 8px;font-weight:800;}
  .hero p{margin:0;font-size:13.5px;color:#DCEEFF;line-height:1.5;}

  .form-area{padding:26px 24px 40px;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:120px;background:#fff;border:1.5px solid var(--line);color:var(--muted);
    font-size:13px;padding:11px 8px;justify-content:center;
  }
  .seg button.active{background:var(--blue-50);border-color:var(--blue-400);color:var(--blue-600);}

  .success{display:none;text-align:center;padding:60px 26px;}
  .success .ic{
    width:74px;height:74px;border-radius:50%;background:var(--green-100);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;
  }
  .success h2{margin:0 0 8px;font-size:19px;}
  .success p{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="formScreen">
    <div class="hero">
      <img src="assets/logo-mark.png" alt="Logo AD Rio Verde">
      <h1>Bem-vindo(a) à família AD Rio Verde</h1>
      <p>Conta pra gente que você chegou — é rapidinho, e alguém da nossa equipe já vai te procurar.</p>
    </div>

    <div class="form-area">
      <label>Seu nome completo *</label>
      <input type="text" id="nome" placeholder="Como você se chama?">

      <label>WhatsApp</label>
      <input type="tel" id="telefone" placeholder="(62) 9 0000-0000">

      <label>Isso é...</label>
      <div class="seg" id="situacaoSeg">
        <button type="button" class="active" data-v="Novo convertido" onclick="setSituacao(this)">Aceitei Jesus agora</button>
        <button type="button" data-v="Carta de transferência" onclick="setSituacao(this)">Vim de outra igreja</button>
        <button type="button" data-v="Visitante recorrente" onclick="setSituacao(this)">Só estou visitando</button>
      </div>

      <label>Qual congregação?</label>
      <input type="text" id="congregacao" list="congList" placeholder="Sede, Betel, Piranhas...">
      <datalist id="congList"></datalist>

      <label>Quem te atendeu agora?</label>
      <input type="text" id="atendente" placeholder="Nome de quem está te cadastrando">

      <button class="btn-ember block" style="margin-top:22px" onclick="enviar()">
        <i class="ti ti-send"></i>Enviar cadastro
      </button>
    </div>
  </div>

  <div class="success" id="successScreen">
    <div class="ic"><i class="ti ti-check"></i></div>
    <h2>Cadastro enviado!</h2>
    <p>Que alegria ter você com a gente. Em breve alguém vai entrar em contato.</p>
    <button class="btn-primary block" onclick="novoCadastro()"><i class="ti ti-user-plus"></i>Cadastrar outra pessoa</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script>
let situacaoAtual = 'Novo convertido';
function setSituacao(btn){
  document.querySelectorAll('#situacaoSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  situacaoAtual = btn.dataset.v;
}
document.getElementById('congList').innerHTML = Store.congregacoes().map(c=>`<option value="${c}">`).join('');

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function enviar(){
  const nome = document.getElementById('nome').value.trim();
  if(!nome){ showToast('Falta seu nome ali em cima :)'); return; }
  Store.addPerson({
    nome,
    telefone: document.getElementById('telefone').value.trim(),
    situacao: situacaoAtual,
    congregacao: document.getElementById('congregacao').value.trim(),
    notas: document.getElementById('atendente').value.trim() ? `Atendido por: ${document.getElementById('atendente').value.trim()}` : '',
    stage: 'cadastro',
  });
  document.getElementById('formScreen').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
}

function novoCadastro(){
  document.getElementById('nome').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('congregacao').value = '';
  document.getElementById('atendente').value = '';
  document.querySelectorAll('#situacaoSeg button').forEach(b=>b.classList.remove('active'));
  document.querySelector('#situacaoSeg button').classList.add('active');
  situacaoAtual = 'Novo convertido';
  document.getElementById('successScreen').style.display = 'none';
  document.getElementById('formScreen').style.display = 'block';
}
</script>
</body>
</html>
